<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Grammar Session</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        /* Fundo Roxo */
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; background-color: #7c3aed; color: #0f172a; height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        
        /* TELA DE LOGIN E SUCESSO */
        .login-wrapper { padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card-box { background: white; padding: 35px 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #f1f5f9; width: 100%; max-width: 400px; text-align: center; margin: auto; }
        .header-title { color: #0f172a; font-weight: 800; font-size: 24px; margin: 0 0 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: -0.5px; }
        
        .input-modern { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 16px; background: #fff; margin-bottom: 20px; font-family: inherit; font-weight: 800; color: #0f172a; box-sizing: border-box; text-transform: uppercase; outline: none; transition: all 0.3s; text-align: center; letter-spacing: 1px; }
        .input-modern:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .input-modern:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
        
        /* Botões Azuis */
        .btn-gradient { width: 100%; padding: 18px; background: #3b82f6; color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; margin-top: 10px; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); }
        .btn-gradient:hover:not(:disabled) { transform: translateY(-3px); background: #2563eb; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); }
        .btn-gradient:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 400px; border-radius: 24px; padding: 35px 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; }

        /* TELA DA ATIVIDADE */
        #view-resolver { display: none; flex-direction: column; height: 100vh; background: transparent; }
        
        /* Cabeçalho Azul */
        .header-resolver-top { background: #3b82f6; padding: 20px 20px 30px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; color: #fff; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-resolver-titulo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        /* Pílulas de Navegação (Azuis) */
        .nav-questoes-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: -20px; padding: 0 20px; position: relative; z-index: 10; }
        .g-btn-pill { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; background: #fff; font-weight: 800; cursor: pointer; color: #64748b; font-size: 14px; transition: 0.3s; display: flex; justify-content: center; align-items: center; padding: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .g-btn-pill.active { background: #3b82f6; color: #fff; border-color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); transform: scale(1.1); }
        .g-btn-pill.respondida:not(.active) { background: #bfdbfe; color: #1d4ed8; border-color: #bfdbfe; }

        /* Estilos do Modo de Revisão */
        .g-btn-pill.pill-correct { background: #3b82f6 !important; color: #fff !important; border-color: #3b82f6 !important; }
        .g-btn-pill.pill-wrong { background: #ef4444 !important; color: #fff !important; border-color: #ef4444 !important; }

        #render-pergunta { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 25px 20px 20px 20px; display: flex; flex-direction: column; }
        
        /* Enunciado sem o ícone */
        .box-enunciado-render { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 25px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; width: 100%; box-sizing: border-box; }
        .texto-enunciado-render { color: #0f172a; font-size: 18px; font-weight: 800; line-height: 1.5; text-align: center; }

        .opcoes-lista { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;}
        .opcao-card { display: flex; align-items: center; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 16px; cursor: pointer; transition: all 0.2s; width: 100%; box-sizing: border-box; }
        .opcao-card input { display: none; }
        
        .letra-indicador { font-weight: 800; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 13px; flex-shrink: 0; transition: 0.3s; border: 1px solid transparent; }
        .texto-opcao { font-weight: 700; font-size: 15px; }

        /* Cores das Alternativas (A: Amarelo, B: Vermelho, C: Verde) */
        .card-opt-A { background: #fef9c3; border-color: #fde047; }
        .card-opt-A .letra-indicador { background: #fde047; color: #854d0e; border-color: #facc15; }
        .card-opt-A .texto-opcao { color: #854d0e; }
        .card-opt-A:has(input:checked):not(.disabled-opt) { border-color: #eab308; background: #fef08a; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-opt-A:has(input:checked):not(.disabled-opt) .letra-indicador { background: #eab308; color: #fff; border-color: #ca8a04; }

        .card-opt-B { background: #fef2f2; border-color: #fca5a5; }
        .card-opt-B .letra-indicador { background: #fecaca; color: #991b1b; border-color: #f87171; }
        .card-opt-B .texto-opcao { color: #991b1b; }
        .card-opt-B:has(input:checked):not(.disabled-opt) { border-color: #ef4444; background: #fee2e2; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-opt-B:has(input:checked):not(.disabled-opt) .letra-indicador { background: #ef4444; color: #fff; border-color: #dc2626; }

        .card-opt-C { background: #f0fdf4; border-color: #86efac; }
        .card-opt-C .letra-indicador { background: #bbf7d0; color: #166534; border-color: #4ade80; }
        .card-opt-C .texto-opcao { color: #166534; }
        .card-opt-C:has(input:checked):not(.disabled-opt) { border-color: #22c55e; background: #dcfce7; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-opt-C:has(input:checked):not(.disabled-opt) .letra-indicador { background: #22c55e; color: #fff; border-color: #16a34a; }

        /* Estilos do Modo de Revisão para Alternativas */
        .opcao-correct { border-color: #3b82f6 !important; background: #eff6ff !important; }
        .opcao-correct .letra-indicador { background: #3b82f6 !important; color: #fff !important; border-color: transparent !important; }
        .opcao-correct .texto-opcao { color: #1e40af !important; }
        
        .opcao-wrong { border-color: #ef4444 !important; background: #fef2f2 !important; }
        .opcao-wrong .letra-indicador { background: #ef4444 !important; color: #fff !important; border-color: transparent !important; }
        .opcao-wrong .texto-opcao { color: #991b1b !important; }

        /* Setas de navegação internas ao card */
        .container-navegacao-setas { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; background: transparent; width: 100%; box-sizing: border-box; }
        .btn-seta-nav { background: #fff; border: none; width: 55px; height: 55px; border-radius: 50%; color: #3b82f6; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.2s; }
        .btn-seta-nav:hover:not(:disabled) { background: #eff6ff; transform: scale(1.05); }
        .btn-seta-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .success-icon-wrap { width: 100px; height: 100px; background: #f5f3ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px auto; box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2); }
        .success-icon-wrap i { font-size: 50px; background: #3b82f6; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .timer-display { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; letter-spacing: 1px;}

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- ALERTA CUSTOMIZADO -->
    <div id="custom-alert-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="alert-icon" style="margin-bottom: 15px;"></div>
            <h3 id="alert-title" style="color: #0f172a; margin-top: 0; font-weight: 800; font-size: 20px;">Aviso</h3>
            <p id="alert-msg" style="color: #64748b; font-size: 15px; line-height: 1.5; margin-bottom: 25px;"></p>
            <button class="btn-gradient" onclick="fecharAlertaCustomizado()">ENTENDI</button>
        </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO -->
    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="margin-bottom: 15px;"><i class="fa-solid fa-triangle-exclamation" style="color: #3b82f6; font-size: 45px;"></i></div>
            <h3 id="confirm-title" style="color: #0f172a; margin-top: 0; font-weight: 800; font-size: 20px;">Aviso</h3>
            <p id="confirm-msg" style="color: #64748b; font-size: 15px; line-height: 1.5; margin-bottom: 25px;"></p>
            <div style="display:flex; flex-direction: column; gap:10px;">
                <button id="btn-confirm-yes" class="btn-gradient">SIM, ENTREGAR AGORA</button>
                <button id="btn-confirm-no" style="background: transparent; color: #64748b; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px; font-size: 14px; font-weight: 800; cursor: pointer;">VOLTAR E REVISAR</button>
            </div>
        </div>
    </div>

    <!-- TELA DE LOGIN -->
    <div id="loginSection" class="login-wrapper">
        <div class="card-box" style="border-top: 6px solid #3b82f6;">
            <div style="width: 80px; height: 80px; background: #eff6ff; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fa-solid fa-user-astronaut" style="font-size: 35px; color: #3b82f6;"></i>
            </div>
            <h2 class="header-title">Identificação</h2>
            <p style="color: #64748b; font-size: 14px; font-weight: 600; margin-bottom: 25px; line-height: 1.5;">Digite o ID da sala com 4 números e seu nome.</p>
            
            <input type="text" id="roomIdInput" class="input-modern" autocomplete="off" placeholder="ID DA SALA" maxlength="4">
            <input type="text" id="studentName" class="input-modern" autocomplete="off" placeholder="SEU NOME COMPLETO">
            
            <button id="btnEnter" class="btn-gradient">ENTRAR NA SALA</button>
        </div>
    </div>

    <!-- TELA DA ATIVIDADE -->
    <div id="view-resolver">
        <div class="header-resolver-top">
            <div class="header-info">
                <button id="btnSairRevisao" class="hidden" style="background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 10px; width: 35px; height: 35px; cursor: pointer; margin-right: 15px;"><i class="fa-solid fa-xmark"></i></button>
                <div class="header-resolver-titulo" id="atividadeTitulo">Carregando...</div>
                <div style="display: flex; gap: 8px;">
                    <div class="timer-display"><i class="fa-regular fa-clock"></i> <span id="timerDisplay">00:00</span></div>
                    <div style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; display:flex; align-items:center;">LIVE <i class="fa-solid fa-circle" style="font-size: 8px; color: #f87171; margin-left: 5px; animation: pulse 1.5s infinite;"></i></div>
                </div>
            </div>
        </div>

        <div class="nav-questoes-container" id="nav-questoes"></div>

        <div id="render-pergunta">
            <!-- As questões e as setas ficarão englobadas neste scroll interno -->
            <div id="questionsContainer" style="width: 100%;"></div>
            
            <div class="container-navegacao-setas">
                <button id="btnPrev" class="btn-seta-nav"><i class="fa-solid fa-chevron-left"></i></button>
                <button id="btnSubmit" class="btn-gradient hidden" style="flex: 1; margin: 0 15px; border-radius: 30px; height: 55px;">
                    ENTREGAR ATIVIDADE
                </button>
                <button id="btnNext" class="btn-seta-nav"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- TELA DE SUCESSO -->
    <div id="successSection" class="login-wrapper hidden">
        <div class="card-box" style="border-top: 6px solid #10b981;">
            <div class="success-icon-wrap">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 style="color: #0f172a; font-weight: 800; font-size: 28px; margin: 0 0 10px 0;">Concluído!</h2>
            <p style="color: #64748b; font-weight: 600; font-size: 16px; margin-bottom: 20px;">Respostas enviadas.</p>
            <p style="color: #3b82f6; font-weight: 800; font-size: 16px; background: #eff6ff; padding: 12px 25px; border-radius: 12px; display: inline-block; letter-spacing: 1px; border: 1px solid #bfdbfe;">
                <i class="fa-regular fa-clock"></i> Tempo: <span id="finalTimeDisplay"></span>
            </p>
            <p style="color: #64748b; font-size: 14px; margin-top: 25px; margin-bottom: 25px; font-weight: 600;">Olhe para o telão para conferir a sua pontuação e classificação.</p>

            <button id="btnReview" class="btn-gradient" style="background: #fff; color: #3b82f6; border: 2px solid #e2e8f0; box-shadow: none;">REVISAR MINHAS RESPOSTAS</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoPCn9UisXYRJFKwxfPoe-5nIhPqOVXt0",
            authDomain: "atividadesonline-2621d.firebaseapp.com",
            projectId: "atividadesonline-2621d",
            storageBucket: "atividadesonline-2621d.firebasestorage.app",
            messagingSenderId: "935315229080",
            appId: "1:935315229080:web:a55e2a949a9096fb55c3ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNÇÕES DE ALERTAS MODERNOS
        window.mostrarAlertaCustomizado = function(titulo, mensagem, tipo = 'error') {
            document.getElementById('alert-title').innerText = titulo;
            document.getElementById('alert-msg').innerText = mensagem;
            const icon = document.getElementById('alert-icon');
            if(tipo === 'error') { icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 45px;"></i>'; } 
            else { icon.innerHTML = '<i class="fa-solid fa-circle-info" style="color: #3b82f6; font-size: 45px;"></i>'; }
            document.getElementById('custom-alert-modal').style.display = 'flex';
        };

        window.fecharAlertaCustomizado = function() { document.getElementById('custom-alert-modal').style.display = 'none'; };

        window.mostrarConfirmacaoCustomizada = function(titulo, mensagem, callbackSim) {
            document.getElementById('confirm-title').innerText = titulo;
            document.getElementById('confirm-msg').innerText = mensagem;
            document.getElementById('custom-confirm-modal').style.display = 'flex';
            document.getElementById('btn-confirm-yes').onclick = function() {
                document.getElementById('custom-confirm-modal').style.display = 'none';
                callbackSim();
            };
            document.getElementById('btn-confirm-no').onclick = function() {
                document.getElementById('custom-confirm-modal').style.display = 'none';
            };
        };

        // LÓGICA DO ID E SESSÃO
        const urlParams = new URLSearchParams(window.location.search);
        let sessaoId = urlParams.get('id');

        const roomIdInput = document.getElementById('roomIdInput');
        if (sessaoId) {
            roomIdInput.value = sessaoId;
            roomIdInput.disabled = true;
        }

        let studentDocId = "";
        let questoesSessao = [];
        let gabaritoCorreto = [];
        let currentIndex = 0;
        let isReviewMode = false;
        
        let timeInicio = null;
        let cronometroInterval = null;
        let totalTempoMs = 0;
        
        const nameInput = document.getElementById('studentName');
        const loginSection = document.getElementById('loginSection');
        const activitySection = document.getElementById('view-resolver');
        const questionsContainer = document.getElementById('questionsContainer');
        const navQuestoes = document.getElementById('nav-questoes');
        
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSairRevisao = document.getElementById('btnSairRevisao');

        nameInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '').toUpperCase(); });
        roomIdInput.addEventListener('input', (e) => { e.target.value = e.target.value.trim().replace(/[^0-9]/g, ''); });

        // INICIAR
        document.getElementById('btnEnter').addEventListener('click', async () => {
            const name = nameInput.value.trim();
            sessaoId = roomIdInput.value.trim();

            if (!sessaoId || sessaoId.length < 4) { window.mostrarAlertaCustomizado("ID da Sala", "Por favor, digite os 4 números do ID da sala.", "error"); return; }
            if (name.length < 2) { window.mostrarAlertaCustomizado("Nome Inválido", "Por favor, digite um nome válido com pelo menos 2 letras.", "error"); return; }
            
            const btn = document.getElementById('btnEnter');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> CARREGANDO...';
            btn.style.pointerEvents = 'none';

            try {
                const sessaoRef = doc(db, "sessoes_ativas", sessaoId);
                const sessaoSnap = await getDoc(sessaoRef);

                if (!sessaoSnap.exists()) {
                    window.mostrarAlertaCustomizado("Sessão Encerrada", "O ID não existe ou a atividade foi encerrada pelo professor.", "error");
                    btn.innerHTML = 'ENTRAR NA SALA';
                    btn.style.pointerEvents = 'auto';
                    return;
                }

                const dadosSessao = sessaoSnap.data();
                document.getElementById('atividadeTitulo').innerText = dadosSessao.titulo || "Atividade Ao Vivo";
                questoesSessao = dadosSessao.questoes || [];
                
                questionsContainer.innerHTML = "";
                navQuestoes.innerHTML = "";

                questoesSessao.forEach((item, index) => {
                    gabaritoCorreto.push(item.answer);
                    const i = index + 1;
                    
                    navQuestoes.innerHTML += `<button class="g-btn-pill" id="pill-${index}" onclick="window.irParaQuestao(${index})">${i}</button>`;

                    questionsContainer.innerHTML += `
                        <div class="question-slide hidden" id="slide-${index}">
                            <div class="box-enunciado-render"><div class="texto-enunciado-render">${item.q}</div></div>
                            <div class="opcoes-lista">
                                <label class="opcao-card card-opt-A"><input type="radio" name="q${i}" value="A" onchange="window.marcarPill(${index})" autocomplete="off"><div class="letra-indicador">A</div><div class="texto-opcao">${item.opts.A}</div></label>
                                <label class="opcao-card card-opt-B"><input type="radio" name="q${i}" value="B" onchange="window.marcarPill(${index})" autocomplete="off"><div class="letra-indicador">B</div><div class="texto-opcao">${item.opts.B}</div></label>
                                <label class="opcao-card card-opt-C"><input type="radio" name="q${i}" value="C" onchange="window.marcarPill(${index})" autocomplete="off"><div class="letra-indicador">C</div><div class="texto-opcao">${item.opts.C}</div></label>
                            </div>
                        </div>
                    `;
                });

                const docRef = await addDoc(collection(db, "grammar_activity"), {
                    name: name,
                    sessaoId: sessaoId,
                    status: "fazendo",
                    score: 0,
                    timeSpent: Infinity, 
                    timestamp: new Date()
                });
                studentDocId = docRef.id;
                
                loginSection.classList.add('hidden');
                activitySection.style.display = 'flex';
                
                window.irParaQuestao(0);
                
                timeInicio = Date.now();
                cronometroInterval = setInterval(atualizarRelogio, 1000);

            } catch (e) {
                console.error("Erro: ", e);
                window.mostrarAlertaCustomizado("Erro", "Não foi possível carregar a atividade. Verifique a internet.", "error");
                btn.innerHTML = 'ENTRAR NA SALA';
                btn.style.pointerEvents = 'auto';
            }
        });

        // RELÓGIO E NAVEGAÇÃO
        function atualizarRelogio() {
            const agora = Date.now();
            const decorrido = Math.floor((agora - timeInicio) / 1000);
            const m = String(Math.floor(decorrido / 60)).padStart(2, '0');
            const s = String(decorrido % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }

        window.irParaQuestao = (index) => {
            currentIndex = index;
            document.querySelectorAll('.question-slide').forEach(slide => slide.classList.add('hidden'));
            document.getElementById(`slide-${index}`).classList.remove('hidden');

            document.querySelectorAll('.g-btn-pill').forEach(pill => {
                pill.classList.remove('active');
            });
            document.getElementById(`pill-${index}`).classList.add('active');

            btnPrev.disabled = (index === 0);
            
            if (index === questoesSessao.length - 1) {
                btnNext.classList.add('hidden');
                if (!isReviewMode) btnSubmit.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnSubmit.classList.add('hidden');
            }
            
            // Força a rolagem para o topo da questão ao mudar
            document.getElementById('render-pergunta').scrollTop = 0;
        };

        window.marcarPill = (index) => {
            if (isReviewMode) return;
            document.getElementById(`pill-${index}`).classList.add('respondida');
            if(index < questoesSessao.length - 1) {
                setTimeout(() => { window.irParaQuestao(index + 1); }, 350);
            }
        };

        btnNext.addEventListener('click', () => { if (currentIndex < questoesSessao.length - 1) window.irParaQuestao(currentIndex + 1); });
        btnPrev.addEventListener('click', () => { if (currentIndex > 0) window.irParaQuestao(currentIndex - 1); });

        // ENVIO DA ATIVIDADE
        btnSubmit.addEventListener('click', async () => {
            const respondidas = document.querySelectorAll('input[type="radio"]:checked').length;
            if(respondidas < questoesSessao.length) {
                window.mostrarConfirmacaoCustomizada(
                    "Faltam Questões!", 
                    `Você respondeu apenas ${respondidas} das ${questoesSessao.length}. Tem certeza que deseja entregar incompleto?`, 
                    processarEnvio
                );
            } else {
                processarEnvio();
            }
        });

        async function processarEnvio() {
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...';
            btnSubmit.style.pointerEvents = 'none';
            
            clearInterval(cronometroInterval);
            totalTempoMs = Date.now() - timeInicio;

            let score = 0;
            for (let i = 1; i <= gabaritoCorreto.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && selected.value === gabaritoCorreto[i-1]) score += 1; 
            }

            try {
                const studentRef = doc(db, "grammar_activity", studentDocId);
                await updateDoc(studentRef, { 
                    status: "entregue", 
                    score: score,
                    timeSpent: totalTempoMs
                });
                
                const minsFinais = String(Math.floor(totalTempoMs / 60000)).padStart(2, '0');
                const segsFinais = String(Math.floor((totalTempoMs % 60000)/1000)).padStart(2, '0');
                document.getElementById('finalTimeDisplay').innerText = `${minsFinais}:${segsFinais}`;

                activitySection.style.display = 'none';
                document.getElementById('successSection').classList.remove('hidden');

            } catch (e) {
                console.error("Erro: ", e);
                window.mostrarAlertaCustomizado("Falha no Envio", "Erro ao enviar respostas. Verifique sua internet.", "error");
                btnSubmit.innerHTML = 'ENTREGAR ATIVIDADE';
                btnSubmit.style.pointerEvents = 'auto';
                
                timeInicio = Date.now() - totalTempoMs;
                cronometroInterval = setInterval(atualizarRelogio, 1000);
            }
        }

        // LÓGICA DE REVISÃO DO ALUNO
        document.getElementById('btnReview').addEventListener('click', () => {
            isReviewMode = true;
            document.getElementById('successSection').classList.add('hidden');
            activitySection.style.display = 'flex';
            
            btnSubmit.style.display = 'none';
            btnSairRevisao.classList.remove('hidden');
            document.getElementById('atividadeTitulo').innerText = "Modo de Revisão";

            // Bloquear edição
            document.querySelectorAll('input[type="radio"]').forEach(radio => radio.classList.add('disabled-opt'));
            document.querySelectorAll('.opcao-card').forEach(card => card.style.pointerEvents = 'none');

            questoesSessao.forEach((item, index) => {
                const correta = gabaritoCorreto[index];
                const inputMarcado = document.querySelector(`input[name="q${index+1}"]:checked`);
                const marcada = inputMarcado ? inputMarcado.value : null;

                const pill = document.getElementById(`pill-${index}`);
                pill.classList.remove('respondida');
                
                if (marcada === correta) {
                    pill.classList.add('pill-correct');
                } else {
                    pill.classList.add('pill-wrong');
                }

                const slide = document.getElementById(`slide-${index}`);
                const options = slide.querySelectorAll('.opcao-card');
                options.forEach(opt => {
                    const val = opt.querySelector('input').value;
                    if (val === correta) {
                        opt.classList.add('opcao-correct');
                    } else if (val === marcada && val !== correta) {
                        opt.classList.add('opcao-wrong');
                    }
                });
            });

            window.irParaQuestao(0);
        });

        btnSairRevisao.addEventListener('click', () => {
            activitySection.style.display = 'none';
            document.getElementById('successSection').classList.remove('hidden');
        });
    </script>
</body>
</html>
